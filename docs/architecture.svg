<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .tier-title { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #334155; }
      .tier-sub   { font-size: 12px; fill: #64748b; }
      .box-title  { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .box-text   { font-size: 12.5px; fill: #334155; }
      .small      { font-size: 11px; fill: #475569; }
      .card       { fill: #ffffff; stroke-width: 1.2; }
      .line       { stroke: #475569; stroke-width: 1.8; fill: none; }
      .dashed     { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="55" font-size="26" font-weight="700" fill="#0f172a">Drogueria Starling — High-Level Architecture</text>
  <text x="40" y="82" font-size="14" fill="#64748b">Product catalog with integrated point of sale (POS) for medicine retail stores · Vue 3 + FastAPI + PostgreSQL</text>

  <!-- ===================== CLIENT TIER ===================== -->
  <rect x="40" y="110" width="440" height="760" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="140" class="tier-title">CLIENT TIER</text>
  <text x="60" y="158" class="tier-sub">Web browser on store PCs / tablets</text>

  <rect x="60" y="170" width="190" height="70" rx="10" class="card" stroke="#3b82f6"/>
  <text x="155" y="200" text-anchor="middle" class="box-title">Cashier</text>
  <text x="155" y="222" text-anchor="middle" class="box-text">POS checkout</text>

  <rect x="270" y="170" width="190" height="70" rx="10" class="card" stroke="#3b82f6"/>
  <text x="365" y="200" text-anchor="middle" class="box-title">Admin / Pharmacist</text>
  <text x="365" y="222" text-anchor="middle" class="box-text">Catalog · stock · reports</text>

  <line x1="155" y1="240" x2="155" y2="278" class="line" marker-end="url(#arrow)"/>
  <line x1="365" y1="240" x2="365" y2="278" class="line" marker-end="url(#arrow)"/>

  <!-- Vue SPA -->
  <rect x="60" y="280" width="400" height="430" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="80" y="310" class="box-title" font-size="17">Vue 3 SPA</text>
  <text x="80" y="332" class="box-text">Vite · TypeScript · Vue Router · Pinia · Axios</text>

  <g class="box-text" text-anchor="middle">
    <rect x="80"  y="350" width="180" height="42" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="170" y="376">POS / Checkout</text>
    <rect x="270" y="350" width="170" height="42" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="355" y="376">Product Catalog</text>
    <rect x="80"  y="402" width="180" height="42" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="170" y="428">Inventory &amp; Expiry</text>
    <rect x="270" y="402" width="170" height="42" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="355" y="428">Customers &amp; Rx</text>
    <rect x="80"  y="454" width="180" height="42" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="170" y="480">Reports &amp; Dashboard</text>
    <rect x="270" y="454" width="170" height="42" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="355" y="480">Auth &amp; Users</text>
  </g>

  <rect x="80" y="514" width="360" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="96" y="538" class="box-text" font-weight="700">Shared layer</text>
  <text x="96" y="560" class="box-text">API client: Axios + JWT interceptor</text>
  <text x="96" y="580" class="box-text">State: Pinia stores (cart, session, catalog)</text>
  <text x="96" y="600" class="box-text">UI kit · i18n (es / en) · form validation</text>

  <rect x="80" y="630" width="360" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" class="dashed"/>
  <text x="96" y="656" class="box-text">Production build → static bundle (dist/)</text>
  <text x="96" y="676" class="small">served by Nginx; no Node server needed in prod</text>

  <!-- Peripherals -->
  <rect x="60" y="760" width="400" height="90" rx="10" class="card" stroke="#3b82f6"/>
  <text x="80" y="788" class="box-title">POS peripherals</text>
  <text x="80" y="810" class="box-text">Barcode scanner (USB HID / keyboard wedge)</text>
  <text x="80" y="830" class="box-text">Thermal receipt printer · Cash drawer</text>

  <line x1="250" y1="712" x2="250" y2="758" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="262" y="740" class="small">scan input / print receipts</text>

  <!-- ===================== EDGE ===================== -->
  <text x="545" y="140" class="tier-title">EDGE</text>
  <rect x="540" y="170" width="170" height="240" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="625" y="200" text-anchor="middle" class="box-title">Nginx</text>
  <text x="625" y="220" text-anchor="middle" class="small">reverse proxy</text>
  <text x="556" y="254" class="box-text">• TLS termination</text>
  <text x="556" y="278" class="box-text">• Serves SPA static</text>
  <text x="556" y="302" class="box-text">• /api/* → FastAPI</text>
  <text x="556" y="326" class="box-text">• gzip · caching</text>
  <text x="556" y="350" class="box-text">• Rate limiting</text>

  <line x1="460" y1="330" x2="538" y2="330" class="line" marker-end="url(#arrow)"/>
  <text x="499" y="320" text-anchor="middle" class="small">HTTPS</text>
  <text x="499" y="348" text-anchor="middle" class="small">REST/JSON</text>

  <!-- ===================== APPLICATION TIER ===================== -->
  <rect x="770" y="110" width="500" height="760" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>

  <line x1="710" y1="230" x2="788" y2="230" class="line" marker-end="url(#arrow)"/>
  <text x="740" y="220" text-anchor="middle" class="small">HTTP</text>
  <text x="790" y="140" class="tier-title">APPLICATION TIER</text>
  <text x="790" y="158" class="tier-sub">FastAPI · Python 3.12 · Uvicorn / Gunicorn</text>

  <rect x="790" y="170" width="460" height="120" rx="10" class="card" stroke="#16a34a"/>
  <text x="806" y="196" class="box-title">API layer · /api/v1</text>
  <text x="806" y="220" class="box-text">Routers (REST) · Pydantic v2 request / response schemas</text>
  <text x="806" y="242" class="box-text">Auth: OAuth2 password flow + JWT · role-based access (RBAC)</text>
  <text x="806" y="264" class="box-text">OpenAPI / Swagger docs · CORS · validation · error handling</text>

  <line x1="1020" y1="290" x2="1020" y2="308" class="line" marker-end="url(#arrow)"/>

  <rect x="790" y="310" width="460" height="300" rx="10" class="card" stroke="#16a34a"/>
  <text x="806" y="336" class="box-title">Domain services (business logic)</text>
  <g>
    <rect x="805"  y="348" width="215" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="817"  y="370" class="box-text" font-weight="700">Catalog</text>
    <text x="817"  y="390" class="small">Products · active ingredients</text>
    <text x="817"  y="408" class="small">presentations · Rx-required flag</text>

    <rect x="1030" y="348" width="205" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1042" y="370" class="box-text" font-weight="700">Inventory</text>
    <text x="1042" y="390" class="small">Lots &amp; expiry dates · FEFO</text>
    <text x="1042" y="408" class="small">stock movements · low stock</text>

    <rect x="805"  y="436" width="215" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="817"  y="458" class="box-text" font-weight="700">POS / Sales</text>
    <text x="817"  y="478" class="small">Cart · pricing · discounts · taxes</text>
    <text x="817"  y="496" class="small">payments · receipts · returns</text>

    <rect x="1030" y="436" width="205" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1042" y="458" class="box-text" font-weight="700">Customers &amp; Rx</text>
    <text x="1042" y="478" class="small">Customer records</text>
    <text x="1042" y="496" class="small">prescription validation</text>

    <rect x="805"  y="524" width="215" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="817"  y="546" class="box-text" font-weight="700">Purchasing</text>
    <text x="817"  y="566" class="small">Suppliers · purchase orders</text>
    <text x="817"  y="584" class="small">goods receipt → stock in</text>

    <rect x="1030" y="524" width="205" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1042" y="546" class="box-text" font-weight="700">Reports &amp; Audit</text>
    <text x="1042" y="566" class="small">Sales / stock / expiry reports</text>
    <text x="1042" y="584" class="small">audit log of every change</text>
  </g>

  <line x1="1020" y1="610" x2="1020" y2="628" class="line" marker-end="url(#arrow)"/>

  <rect x="790" y="630" width="460" height="90" rx="10" class="card" stroke="#16a34a"/>
  <text x="806" y="656" class="box-title">Data access layer</text>
  <text x="806" y="680" class="box-text">SQLAlchemy 2.0 ORM · repositories · transactional unit of work</text>
  <text x="806" y="702" class="box-text">Alembic schema migrations</text>

  <rect x="790" y="740" width="460" height="110" rx="10" class="card" stroke="#16a34a"/>
  <text x="806" y="766" class="box-title">Background jobs</text>
  <text x="806" y="790" class="box-text">Expiry &amp; low-stock alerts (APScheduler; Celery later)</text>
  <text x="806" y="812" class="box-text">Report exports (PDF / Excel)</text>
  <text x="806" y="834" class="box-text">Uses the same services &amp; data access layer</text>

  <!-- ===================== DATA TIER ===================== -->
  <rect x="1330" y="110" width="230" height="630" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="1350" y="140" class="tier-title">DATA TIER</text>

  <path d="M1350,190 L1350,690 A95,18 0 0 0 1540,690 L1540,190" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <ellipse cx="1445" cy="190" rx="95" ry="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="1445" y="248" text-anchor="middle" class="box-title" font-size="17">PostgreSQL 18</text>
  <text x="1445" y="268" text-anchor="middle" class="small">single source of truth</text>

  <g class="box-text" text-anchor="middle">
    <text x="1445" y="310" font-weight="700">Main tables</text>
    <text x="1445" y="336">products · categories</text>
    <text x="1445" y="358">ingredients · presentations</text>
    <text x="1445" y="380">lots · stock_movements</text>
    <text x="1445" y="402">sales · sale_items</text>
    <text x="1445" y="424">payments · returns</text>
    <text x="1445" y="446">customers · prescriptions</text>
    <text x="1445" y="468">suppliers · purchase_orders</text>
    <text x="1445" y="490">users · roles · audit_log</text>
  </g>
  <line x1="1370" y1="515" x2="1520" y2="515" stroke="#c7d2fe"/>
  <text x="1445" y="545" text-anchor="middle" class="small">ACID transactions for checkout</text>
  <text x="1445" y="565" text-anchor="middle" class="small">(sale + stock decrement atomically)</text>
  <text x="1445" y="595" text-anchor="middle" class="small">Indexes: barcode, name (pg_trgm)</text>
  <text x="1445" y="635" text-anchor="middle" class="small">Persistent volume</text>
  <text x="1445" y="655" text-anchor="middle" class="small">daily pg_dump backups</text>

  <line x1="1250" y1="675" x2="1348" y2="675" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1299" y="665" text-anchor="middle" class="small">SQL</text>
  <text x="1299" y="693" text-anchor="middle" class="small">asyncpg</text>

  <!-- External -->
  <rect x="1330" y="760" width="230" height="110" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" class="dashed"/>
  <text x="1346" y="786" class="box-title">External (future)</text>
  <text x="1346" y="808" class="small">E-invoicing provider / tax authority</text>
  <text x="1346" y="828" class="small">Card payment terminal / gateway</text>
  <text x="1346" y="848" class="small">Email / SMS notifications</text>

  <line x1="1250" y1="805" x2="1328" y2="805" class="line dashed" marker-end="url(#arrow)"/>
  <text x="1289" y="795" text-anchor="middle" class="small">HTTPS</text>

  <!-- ===================== DEPLOYMENT BAND ===================== -->
  <rect x="40" y="900" width="1520" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="930" class="tier-title">DEPLOYMENT</text>
  <text x="60" y="954" class="box-text">Docker Compose: web (Nginx + Vue build) · api (FastAPI + Uvicorn) · db (existing PostgreSQL 18 container, shared network)   |   CI: lint · tests (pytest / Vitest) · build images</text>

  <!-- Legend -->
  <line x1="1250" y1="926" x2="1290" y2="926" class="line" marker-end="url(#arrow)"/>
  <text x="1300" y="930" class="small">request / data flow</text>
  <line x1="1250" y1="952" x2="1290" y2="952" class="line dashed" marker-end="url(#arrow)"/>
  <text x="1300" y="956" class="small">optional / future</text>
</svg>
